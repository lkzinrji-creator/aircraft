name: Build Aircraft Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build mod
        run: gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: aircraft-mod-minecraft-26.3
          path: build/libs/*.jar
          if-no-files-found: error
